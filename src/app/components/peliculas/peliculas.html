<div class="container-fluid px-4 py-3">

  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <h2 class="text-black fw-bold mb-0 text-uppercase tracking-wide">
      Lista de Películas Recomendadas
    </h2>
    <span class="badge bg-warning text-dark fs-6 fw-bold shadow-sm">
      {{ cargando ? 'Sincronizando...' : listaPeliculas.length + ' Disponibles' }}
    </span>
  </div>

  <div *ngIf="cargando" class="py-5 text-center">
    <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <h4 class="text-secondary fw-light">Conectando con el servidor de IMDb...</h4>
    <p class="text-muted small">Por favor espere un momento.</p>
  </div>

  <div *ngIf="!cargando" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    
    <div class="col" *ngFor="let peli of listaPeliculas">
      <div class="card h-100 text-white bg-dark border-secondary shadow rounded-3 overflow-hidden">
        
        <div class="ratio ratio-16x9 bg-black">
          <img [src]="peli.image" class="card-img-top object-fit-cover" [alt]="peli.title">
        </div>
        
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title fw-bold mb-1 text-warning text-uppercase">{{ peli.title }}</h5>
            <p class="text-muted small mb-3">Lanzamiento: {{ peli.year }}</p>
            <p class="card-text text-secondary small text-truncate-3">
              <strong>Sinopsis:</strong> {{ peli.description }}
            </p>
          </div>

          <div class="mt-3 border-top pt-2 border-secondary">
            <small class="text-muted d-block mb-1">Géneros:</small>
            <span class="badge bg-secondary text-wrap text-start w-100 py-2">
              {{ peli.genre }}
            </span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
